    <main>
      <section class="safety-hero">
        <div class="zipai-container safety-hero-grid">
          <div>
            <span class="safety-eyebrow"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i> ZipAI 안전도</span>
            <h1>거주 전 안전도를 지도에서 바로 확인하세요</h1>
            <p>지역안전, 범죄 주의구간, 여성 밤길 치안안전, 치안시설, 안전 비상벨, CCTV 데이터를 종합해 청년 주거 안전점수를 제공합니다.</p>

            <div class="safety-summary" aria-label="안전도 요약">
              <div class="safety-summary-item">
                <strong>87</strong>
                <span>예상 안전점수</span>
              </div>
              <div class="safety-summary-item">
                <strong>42</strong>
                <span>반경 내 치안시설</span>
              </div>
              <div class="safety-summary-item">
                <strong>16</strong>
                <span>비상벨·CCTV</span>
              </div>
            </div>
          </div>

          <div class="zipai-card safety-preview" aria-label="안전도 지도 미리보기">
            <div class="safety-preview-panel">
              <div>
                <strong>서울시 마포구 연남동</strong>
                <span>치안시설 접근성 우수, 야간 보행 안전 양호</span>
              </div>
              <div class="safety-preview-score">87</div>
            </div>
          </div>
        </div>
      </section>

      <section class="zipai-container" id="safety-search">
        <aside class="zipai-card safety-control-panel" aria-label="안전도 검색 조건">
          <div class="safety-panel-head">
            <h2>안전도 검색</h2>
            <span><i class="fa-solid fa-circle-check" aria-hidden="true"></i> 실시간 분석</span>
          </div>

          <form class="safety-search-form" action="#" method="get">
            <div class="safety-field">
              <label for="safety-keyword">지역 또는 매물명</label>
              <div class="safety-input-wrap">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input id="safety-keyword" name="keyword" type="search" value="서울시 마포구 연남동" placeholder="지역, 지하철역, 매물명 검색">
              </div>
            </div>

            <div class="row g-2">
              <div class="col-12 col-sm-6">
                <div class="safety-field">
                  <label for="safety-type">거주 유형</label>
                  <select id="safety-type" name="type">
                    <option>전세</option>
                    <option>월세</option>
                    <option>반전세</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="safety-field">
                  <label for="safety-radius">분석 반경</label>
                  <select id="safety-radius" name="radius">
                    <option>500m</option>
                    <option>1km</option>
                    <option>1.5km</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="safety-filter-grid" aria-label="안전도 분석 항목">
              <label class="safety-check"><input type="checkbox" checked> 지역안전</label>
              <label class="safety-check"><input type="checkbox" checked> 범죄 주의구간</label>
              <label class="safety-check"><input type="checkbox" checked> 여성 밤길</label>
              <label class="safety-check"><input type="checkbox" checked> 치안시설</label>
              <label class="safety-check"><input type="checkbox" checked> 안전 비상벨</label>
              <label class="safety-check"><input type="checkbox" checked> CCTV 여부</label>
            </div>

            <div class="safety-control-actions">
              <button class="zipai-btn zipai-btn-primary" type="submit">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                분석하기
              </button>
              <button class="zipai-btn zipai-btn-muted" type="reset">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                초기화
              </button>
            </div>
          </form>
        </aside>
      </section>
    </main>
