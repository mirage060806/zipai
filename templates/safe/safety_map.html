    <main>
      <section class="safety-hero">
        <div class="zipai-container">
          <span class="safety-eyebrow"><i class="fa-solid fa-map-location-dot" aria-hidden="true"></i> 안전도 지도</span>
          <h1>위험 구간과 안전시설을 지도에서 확인하세요</h1>
          <p>검색 위치 주변의 치안·시설 데이터를 색상과 아이콘으로 구분해 보여주는 안전도 지도입니다.</p>
        </div>
      </section>

      <section class="zipai-container">
        <section class="zipai-card safety-map-shell" aria-label="안전도 지도">
          <div class="safety-map-toolbar">
            <div class="safety-map-title">
              <h2>연남동 안전도 히트맵</h2>
              <p>색상이 진할수록 주의가 필요한 구간입니다.</p>
            </div>
            <div class="safety-map-tabs" aria-label="지도 보기 방식">
              <button type="button" class="is-active"><i class="fa-solid fa-map" aria-hidden="true"></i> 일반지도</button>
              <button type="button"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> 위성지도</button>
              <button type="button"><i class="fa-solid fa-route" aria-hidden="true"></i> 밤길</button>
            </div>
          </div>

          <div class="safety-map">
            <div class="map-water" aria-hidden="true"></div>
            <div class="map-road road-1" aria-hidden="true"></div>
            <div class="map-road road-2" aria-hidden="true"></div>
            <div class="map-road road-3" aria-hidden="true"></div>

            <span class="risk-zone safe" style="left: 20%; top: 25%;" aria-hidden="true"></span>
            <span class="risk-zone safe" style="left: 74%; top: 34%;" aria-hidden="true"></span>
            <span class="risk-zone caution" style="left: 44%; top: 35%;" aria-hidden="true"></span>
            <span class="risk-zone caution" style="left: 34%; top: 72%;" aria-hidden="true"></span>
            <span class="risk-zone danger" style="left: 62%; top: 62%;" aria-hidden="true"></span>
            <span class="risk-zone danger" style="left: 82%; top: 74%;" aria-hidden="true"></span>

            <span class="map-pin" style="left: 28%; top: 42%; --tone: var(--zipai-primary);" title="CCTV">
              <i class="fa-solid fa-video" aria-hidden="true"></i>
            </span>
            <span class="map-pin" style="left: 52%; top: 48%; --tone: var(--zipai-safe);" title="지구대">
              <i class="fa-solid fa-building-shield" aria-hidden="true"></i>
            </span>
            <span class="map-pin" style="left: 69%; top: 29%; --tone: var(--zipai-warning);" title="주의구간">
              <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            </span>
            <span class="map-pin" style="left: 78%; top: 63%; --tone: var(--zipai-danger);" title="범죄 주의">
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            </span>

            <div class="zipai-card map-floating-card">
              <h3>지도 안전 레이어</h3>
              <p>검색 위치 주변의 치안·시설 데이터를 색상과 아이콘으로 표시합니다.</p>
              <div class="map-legend">
                <span><i style="--tone: var(--zipai-safe);"></i> 안전 우수</span>
                <span><i style="--tone: var(--zipai-warning);"></i> 주의 필요</span>
                <span><i style="--tone: var(--zipai-danger);"></i> 고위험 구간</span>
                <span><i style="--tone: var(--zipai-primary);"></i> CCTV·비상벨</span>
              </div>
            </div>

            <div class="map-zoom" aria-label="지도 확대 축소">
              <button type="button" aria-label="확대"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
              <button type="button" aria-label="축소"><i class="fa-solid fa-minus" aria-hidden="true"></i></button>
              <button type="button" aria-label="현재 위치"><i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i></button>
            </div>

            <div class="map-bottom-bar">
              <div>
                <strong>종합 안전점수 87점</strong>
                <span>연남동 반경 500m 분석</span>
              </div>
              <span>데이터 기준 2026.07</span>
            </div>
          </div>
        </section>
      </section>
    </main>
