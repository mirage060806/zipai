<!DOCTYPE html>
<html lang="ko" id="pageTop">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대출한도 & 금리 계산기 - zipai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/common.css">
    <link rel="stylesheet" href="../../static/css/trend.css?v=20260724">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../../static/css/footer.css?v=20260916-10">
    <link rel="stylesheet" href="../../static/css/header.css?v=20260916-10">
    <link rel="stylesheet" href="../../static/css/auth.css?v=20260916-10">
    <script src="../../static/js/auth.js?v=20260916-10" defer></script>
    <script src="../../static/js/common-layout.js?v=20260916-10" defer></script>
</head>
<body class="has-zipai-footer">
  <div class="zipai-header"></div>

  

    <main class="trend-wrapper">
        <div class="container">
            <div class="mb-4">
                <a href="/board/trend1" style="color:var(--secondary-color); text-decoration:none;"><i class="fas fa-arrow-left"></i> 뒤로가기</a>
            </div>
            <div class="page-header">
                <h2>대출한도 & 금리 계산기</h2>
                <p>원하는 상환 방식과 우대 조건들을 선택하여 상세한 납입 스케줄과 총 이자 비용을 계산해 보세요.</p>
            </div>
            
            <div class="calc-container">
                <form id="calcForm" class="calc-form">
                    <div class="filter-group mb-3">
                        <label for="principal">대출 원금 (만원)</label>
                        <input type="number" id="principal" value="10000" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;" required>
                    </div>
                    <div class="filter-group mb-3 mt-3">
                        <label for="rate">연 이자율 (%)</label>
                        <input type="number" step="0.01" id="rate" value="3.5" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;" required>
                        <!-- 실시간 적용금리 표시 영역 (레이아웃 밀림 방지를 위해 공간 예약) -->
                        <div id="appliedRateArea" style="font-size: 0.85rem; margin-top: 5px; color: var(--primary-color); visibility: hidden; min-height: 1.3rem;">
                            적용 금리: <strong id="appliedRate">3.5%</strong> (우대금리 <span id="discountText">0%</span> 적용됨)
                        </div>
                    </div>
                    <div class="filter-group mb-3 mt-3">
                        <label for="term">대출 기간 (년)</label>
                        <input type="number" id="term" value="30" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;" required>
                    </div>
                    <div class="filter-group mb-3 mt-3">
                        <label for="repayType">상환 방식</label>
                        <select id="repayType" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
                            <option value="level-both">원리금균등상환</option>
                            <option value="level-principal">원금균등상환</option>
                            <option value="bullet">원금만기일시상환</option>
                        </select>
                    </div>
                    <div class="mb-3 mt-3">
                        <label style="font-weight: 600; display: block; margin-bottom: 8px;">우대 금리 조건 (중복 적용)</label>
                        <div class="d-flex flex-column gap-2" style="font-size: 0.9rem; color: #555;">
                            <label class="d-flex align-items-center gap-2" style="cursor:pointer; margin: 0;">
                                <input type="checkbox" class="rate-discount" value="0.20" id="chkSubscription"> 청약저축 가입자 (-0.2%p)
                            </label>
                            <label class="d-flex align-items-center gap-2" style="cursor:pointer; margin: 0;">
                                <input type="checkbox" class="rate-discount" value="0.30" id="chkMultiChildren"> 다자녀 가구 (-0.3%p)
                            </label>
                            <label class="d-flex align-items-center gap-2" style="cursor:pointer; margin: 0;">
                                <input type="checkbox" class="rate-discount" value="0.10" id="chkNewborn"> 신생아 특례 가구 (-0.1%p)
                            </label>
                            <label class="d-flex align-items-center gap-2" style="cursor:pointer; margin: 0;">
                                <input type="checkbox" class="rate-discount" value="0.10" id="chkElectronic"> 전자계약 체결 (-0.1%p)
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn-search mt-3">계산하기</button>
                </form>
                
                <div class="calc-result" style="background: var(--bg-white); border: 1px solid var(--zipai-border); border-radius: 8px; box-shadow: var(--zipai-shadow-sm); padding: 24px; color: var(--color-text); margin-top: 0;">
                    <h3 style="color: var(--accent-color); font-weight: 700; margin-top: 0; margin-bottom: 20px; font-size: 1.25rem;">계산 결과</h3>
                    
                    <div class="mb-4">
                        <span style="font-size: 0.9rem; color: var(--secondary-color);">첫 달 상환액 (1회차)</span>
                        <div class="amount" id="calcResultVal" style="color: var(--primary-color); font-size: 2rem; font-weight: 800; font-family: var(--font-title); margin: 5px 0;">0 원</div>
                        <span id="repayTypeLabel" style="font-size: 0.85rem; color: var(--secondary-color);">원리금균등상환 기준</span>
                    </div>
                    
                    <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
                    
                    <div class="d-flex justify-content-between mb-2" style="font-size: 0.95rem;">
                        <span>총 대출 원금</span>
                        <strong id="resPrincipal">0 원</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2" style="font-size: 0.95rem;">
                        <span>총 납부 이자</span>
                        <strong id="resTotalInterest" style="color: #e64b3c;">0 원</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-3" style="font-size: 1.05rem; font-weight: 700; color: var(--accent-color);">
                        <span>총 상환 금액</span>
                        <span id="resTotalRepayment">0 원</span>
                    </div>

                    <!-- 원금 vs 이자 프로그레스 바 -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1" style="font-size: 0.8rem; color: var(--secondary-color);">
                            <span id="percentPrincipal">원금 100%</span>
                            <span id="percentInterest">이자 0%</span>
                        </div>
                        <div class="progress" style="height: 12px; border-radius: 6px; background: #e9ecef; overflow: hidden; display: flex;">
                            <div id="barPrincipal" class="progress-bar" role="progressbar" style="width: 100%; background-color: var(--primary-color);" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                            <div id="barInterest" class="progress-bar" role="progressbar" style="width: 0%; background-color: #e64b3c;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                    
                    <!-- 내보내기 및 공유하기 버튼 -->
                    <div class="d-flex gap-2">
                        <button type="button" id="btnPrint" class="btn btn-outline-secondary btn-sm" style="flex: 1; padding: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight:600; border:1px solid #ddd; background:#fff; border-radius:6px; cursor:pointer;">
                            <i class="fa-solid fa-print"></i> PDF/인쇄
                        </button>
                        <button type="button" id="btnCopyLink" class="btn btn-outline-secondary btn-sm" style="flex: 1; padding: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight:600; border:1px solid #ddd; background:#fff; border-radius:6px; cursor:pointer;">
                            <i class="fa-solid fa-link"></i> 결과 공유
                        </button>
                    </div>
                </div>
            </div>

            <!-- 월별 상환 스케줄 영역 -->
            <div class="mt-4" id="scheduleArea" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 style="color:var(--accent-color); font-size:1.3rem; margin:0; font-weight:700;">
                        <i class="fas fa-calendar-alt me-2"></i> 회차별 상세 상환 스케줄
                    </h3>
                    <button type="button" id="btnToggleSchedule" class="btn btn-sm btn-outline-primary" style="padding: 6px 12px; font-size: 0.9rem; font-weight: 600; border:1px solid var(--primary-color); background:none; color:var(--primary-color); border-radius:4px; cursor:pointer;">
                        스케줄 접기 <i class="fas fa-chevron-up ms-1"></i>
                    </button>
                </div>
                <div class="table-responsive bg-white rounded shadow-sm border p-2" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover text-center align-middle mb-0" style="font-size: 0.9rem; min-width: 600px;">
                        <thead style="background-color: var(--bg-light); position: sticky; top: 0; z-index: 10;">
                            <tr>
                                <th scope="col" style="width: 10%;">회차</th>
                                <th scope="col" style="width: 22.5%;">납입원금</th>
                                <th scope="col" style="width: 22.5%;">납입이자</th>
                                <th scope="col" style="width: 22.5%;">월 납입금</th>
                                <th scope="col" style="width: 22.5%;">대출잔액</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody">
                            <!-- Javascript에서 동적 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

  <footer class="zipai-footer"></footer>
<script src="../../static/js/trend.js"></script>
</body>
</html>
