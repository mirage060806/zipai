<!DOCTYPE html>
<html lang="ko" id="pageTop">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="집아이 로그인 및 계정 페이지">
  <title>로그인 | 집아이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/css/header.css?v=20261001-mobile2">
  <link rel="stylesheet" href="/static/css/footer.css?v=20261001-mobile2">
  <link rel="stylesheet" href="/static/css/auth.css?v=20260928-2">
  <link rel="stylesheet" href="/static/css/guest-login.css?v=20261007-modes2">
  <script src="/static/js/auth.js?v=20261007-native1" defer></script>
  <script src="/static/js/login.js?v=20261007-modes2" defer></script>
</head>
<body class="has-zipai-footer login-page">
       <div class="zipai-header"></div>

  

  <main class="login-page-main">
    <section class="login-page-card" aria-labelledby="loginPageTitle">
      <div class="login-view" data-login-view="form">
        <span class="login-page-symbol"><i class="fa-solid fa-user-shield" aria-hidden="true"></i></span>
        <h1 id="loginPageTitle">집아이 로그인</h1>
        <p class="login-page-description">로그인하고 찜한 매물과 계약 준비 정보를 저장하세요.</p>
        <form class="login-page-form" id="loginForm">
          <label class="login-page-field">아이디<input name="userId" type="text" autocomplete="username" minlength="4" maxlength="20" placeholder="zipai_user" required></label>
          <label class="login-page-field">비밀번호<input name="password" type="password" autocomplete="current-password" minlength="8" placeholder="8자 이상 입력" required></label>
          <button class="login-page-submit" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> 로그인</button>
        </form>
        <div class="social-login" id="socialLogin" hidden>
          <div class="social-login-divider"><span>또는 소셜 계정으로 로그인</span></div>
          <div class="social-login-buttons">
            <a class="social-login-button is-kakao" data-social-provider="kakao" href="/oauth2/authorization/kakao" hidden>카카오로 계속하기</a>
            <a class="social-login-button is-naver" data-social-provider="naver" href="/oauth2/authorization/naver" hidden>네이버로 계속하기</a>
            <a class="social-login-button is-google" data-social-provider="google" href="/oauth2/authorization/google" hidden>
              <svg class="google-signin-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.55h3.24c1.9-1.75 2.98-4.33 2.98-7.42Z"/>
                <path fill="#34A853" d="M12 22c2.7 0 4.98-.9 6.63-2.35l-3.24-2.55c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.63A10 10 0 0 0 12 22Z"/>
                <path fill="#FBBC05" d="M6.39 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.12-1.32.31-1.93V7.44H3.05A10 10 0 0 0 2 12c0 1.61.38 3.14 1.05 4.56l3.34-2.63Z"/>
                <path fill="#EA4335" d="M12 5.94c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.65 9.65 0 0 0 12 2a10 10 0 0 0-8.95 5.44l3.34 2.63C7.18 7.7 9.39 5.94 12 5.94Z"/>
              </svg>
              <span>Google 계정으로 계속하기</span>
            </a>
          </div>
        </div>
        <div class="login-guest-entry">
          <div class="login-guest-modes">
            <a class="login-guest-button" id="loginGuestBrowse" href="/demo/start?mode=user"><i class="fa-solid fa-user" aria-hidden="true"></i> 일반 사용자 체험</a>
            <a class="login-guest-button login-guest-admin" id="loginGuestAdmin" href="/demo/start?mode=admin"><i class="fa-solid fa-user-tie" aria-hidden="true"></i> 관리자 체험</a>
          </div>
          <p>기존 일반 사용자·관리자 화면에서 바로 체험하세요.<br>실제 회원 정보와 운영 데이터 변경은 본인 로그인 후 이용합니다.</p>
        </div>
        <p class="login-page-switch">계정이 없으신가요? <a href="/member/signup"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> 회원가입</a></p>
        <p class="login-page-demo"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>비밀번호는 서버에서 안전한 해시로 확인되며 로그인 세션으로 인증합니다.</span></p>
      </div>

    </section>
  </main>

  <footer class="zipai-footer"></footer>
  <script src="../../static/js/common-layout.js?v=20260916-10" defer></script>
</body>
</html>
