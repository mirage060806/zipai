<!DOCTYPE html>
<html lang="ko" id="pageTop">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="집아이 회원가입 페이지">
  <title>회원가입 | 집아이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/css/header.css?v=20260916-10">
  <link rel="stylesheet" href="/static/css/footer.css?v=20260916-10">
  <link rel="stylesheet" href="/static/css/auth.css?v=20260929-2">
  <script src="/static/js/auth.js?v=20260916-10" defer></script>
  <script src="/static/js/signup.js?v=20260929-1" defer></script>
</head>
<body class="has-zipai-footer login-page">
       <div class="zipai-header"></div>

  

  <main class="login-page-main">
    <section class="login-page-card signup-page-card" aria-labelledby="signupPageTitle">
      <div class="login-view" data-login-view="signup">
        <span class="login-page-symbol"><i class="fa-solid fa-user-plus" aria-hidden="true"></i></span>
        <h1 id="signupPageTitle">집아이 회원가입</h1>
        <p class="login-page-description">계정을 만들고 관심 매물과 계약 준비 정보를 바로 이어서 확인하세요.</p>
<form class="login-page-form" id="signupForm">
          <label class="login-page-field">아이디<input name="userId" type="text" autocomplete="username" minlength="4" maxlength="20" placeholder="zipai_user" required></label>
          <label class="login-page-field">이메일<input name="email" type="email" autocomplete="email" placeholder="zipai@example.com" required></label>
          <label class="login-page-field">휴대폰 번호<input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000" required></label>
<label class="login-page-field">비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상 입력" required></label>
          <label class="login-page-field">비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="비밀번호를 한 번 더 입력" required></label>
          <label class="login-page-consent"><input name="terms" type="checkbox" required><span><a href="/terms#service" target="_blank" rel="noopener noreferrer">이용약관</a>과 <a href="/terms#privacy" target="_blank" rel="noopener noreferrer">개인정보처리방침</a>을 확인했으며 이에 동의합니다.</span></label>
          <button class="login-page-submit" id="signupSubmit" type="submit">
            <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
            <span>회원가입</span>
          </button>
        </form>
        <p class="login-page-switch">이미 계정이 있으신가요? <a href="/member/login"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> 로그인</a></p>
        <p class="login-page-demo"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>비밀번호는 원문이 아닌 안전한 해시로 서버 데이터베이스에 저장되며, 가입 완료 후 로그인 상태로 이동합니다.</span></p>
      </div>
    </section>
  </main>

  <footer class="zipai-footer"></footer>
  <script src="../../static/js/common-layout.js?v=20260916-10" defer></script>
</body>
</html>
