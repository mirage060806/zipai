spring:
  datasource:
    url: jdbc:h2:mem:zipai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      # schema.sql is an operational TiDB dump; Hibernate creates the test schema.
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
server:
  servlet:
    session:
      cookie:
        secure: false
