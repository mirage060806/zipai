spring:
  application:
    name: zipai

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/zipai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: "${DB_USERNAME:zipai}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never
      encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    encoding: UTF-8

  thymeleaf:
    prefix: file:./templates/
    suffix: .html
    cache: false

  mvc:
    static-path-pattern: /static/**

  web:
    resources:
      static-locations: file:./static/

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:not-configured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID:not-configured}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET:not-configured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email
            client-name: Naver
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:not-configured}
            scope: openid,profile,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

zipai:
  admin:
    bootstrap-enabled: ${ZIPAI_ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ZIPAI_ADMIN_USERNAME:}
    email: ${ZIPAI_ADMIN_EMAIL:}
    phone: ${ZIPAI_ADMIN_PHONE:}
    password: ${ZIPAI_ADMIN_PASSWORD:}
  lifestyle:
    ml:
      python-command: ${ZIPAI_LIFESTYLE_ML_PYTHON_COMMAND:}
      script-path: ${ZIPAI_LIFESTYLE_ML_SCRIPT_PATH:rpa/lifestyle_ml/recommendation_service.py}
  finance:
    import-token: ${FINANCE_IMPORT_TOKEN:}
  safety:
    vworld-api-key: ${VWORLD_API_KEY:}
    default-radius-meters: ${SAFETY_DEFAULT_RADIUS_METERS:500}
    max-radius-meters: ${SAFETY_MAX_RADIUS_METERS:2000}
  oauth:
    kakao-configured: ${KAKAO_OAUTH_CONFIGURED:false}
    naver-configured: ${NAVER_OAUTH_CONFIGURED:false}
    google-configured: ${GOOGLE_OAUTH_CONFIGURED:false}
