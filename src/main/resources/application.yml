server:
  address: ${SERVER_HOST:127.0.0.1}
  # Render injects PORT. SERVER_PORT remains available for local development.
  port: ${PORT:${SERVER_PORT:4173}}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        name: ZIPAI_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: zipai
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zipai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:zipai}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server.error.include-message: never
