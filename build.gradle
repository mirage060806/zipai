plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zipai'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    from('index.html') { into 'static' }
    from('sub3.html') { into 'static' }
    from('static') { into 'static/static' }
    from('templates') { into 'static/templates' }
    from('templates') { into 'templates' }
}

tasks.register('resetAdminPassword', JavaExec) {
    group = 'administration'
    description = 'Reset an application administrator password using DB_* environment variables.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zipai.tools.ResetAdminPassword'
}

tasks.register('listAdminAccounts', JavaExec) {
    group = 'administration'
    description = 'List application administrator accounts without modifying the database.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zipai.tools.ListAdminAccounts'
}

tasks.register('createAdminAccount', JavaExec) {
    group = 'administration'
    description = 'Create a new active application administrator account.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zipai.tools.CreateAdminAccount'
}
