services:
  - type: web
    name: zipai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PUBLIC_DATA_SERVICE_KEY
        sync: false
